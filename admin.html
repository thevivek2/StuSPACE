<!doctype html><html><head><meta charset="utf-8"><title>Admin · StuSPACE</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="app.css"></head><body class="admin">
<main><div class="pagehead" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><h1 style="margin:0">Admin · Reviewer console</h1><span><button class="alt" id="menuBtn"></button> <button class="alt" id="closeBtn" title="Close the admin console">✕ Close</button></span></div>
<div class="adm" id="adm"><aside class="side"><div class="sh"><span>Menu</span><button class="alt" id="sideX" title="Close menu">✕</button></div><div class="sidenav" id="tabs"></div><a href="#" id="purge" class="purge">Delete all data</a></aside>
<div class="admmain"><div class="card"><div id="custom"></div><div class="toolbar" id="tools"></div><div class="table-wrap" id="tbl"></div><div class="pager" id="pager"></div></div></div></div>
</main>
<dialog id="rv"><div id="rvBody"></div></dialog>
<script src="common.js"></script><script>
const PAGE=10;let data={insights:[],rewards:[],principals:[],emails:[],fund:null,summary:null,admins:[],plans:[],templates:[],configs:[],programVideos:[],funds:[],health:null};
const S={tab:'dashboard',fundOpen:false,q:'',filter:'all',page:1,tpl:'insight_request',msel:new Set(),mq:'',mpage:1,msearch:'',rq:''};
let ME={id:null,role:'super'};
const isSuper=()=>(ME.role||'super')==='super';
const ADMIN_TABS=['dashboard','insights','principals'];
const tabVisible=k=>isSuper()||ADMIN_TABS.includes(k);
const locked=r=>!!r&&!!ME.id&&(r.createdBy===ME.id);
const LOCKNOTE='<p class="small" style="color:#a00">You created this row, so another admin must change its status.</p>';
function lockField(sel,hidden=true){const el=$(sel);if(!el)return;el.disabled=true;if(hidden&&el.name)el.insertAdjacentHTML('beforebegin','<input type="hidden" name="'+el.name+'" value="'+esc(el.value)+'">');el.insertAdjacentHTML('afterend',LOCKNOTE)}
const fundBadge=i=>i.fundingStatus==="Released"?badge("Published","Approved"):i.fundingStatus==="Pending"||i.funded?badge("OnReview","Funding requested"):"—";
document.querySelector('header nav')?.remove(); // no Home / Insights / Register links in the admin header
const badge=(c,t)=>`<span class="badge ${esc(c)}">${esc(t)}</span>`;
const bytes=n=>{n=Number(n)||0;const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<4){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]};
const dur=s=>s?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):'';
const hist=(e,i)=>`<button class="btn-sm alt" title="Audit history" aria-label="Audit history" data-audit="${e}:${esc(i)}">${ICON.history}</button>`;
const bt=(attr,ic,extra='')=>`<button class="btn-sm ${extra}" ${attr}>${ic}</button>`;
const TABS={
 dashboard:{label:'Dashboard',icon:ICON.dash,custom:()=>dashHtml()},
 insights:{label:'Works',icon:ICON.video,filters:[['all','All history'],['last30','Last 30'],['Published','Published'],['OnReview','On review'],['funded','Approved'],['requested','Funding requested']],
  rows:()=>{let l=data.insights;if(S.filter==='last30')l=l.slice(0,30);else if(S.filter==='funded')l=l.filter(i=>i.fundingStatus==='Released');else if(S.filter==='requested')l=l.filter(i=>i.funded&&i.fundingStatus!=='Released');else if(S.filter!=='all')l=l.filter(i=>i.status===S.filter);return l},
  text:i=>[i.principal.name,i.principal.school.name,i.status,i.fundingStatus==='Released'?'funding approved':i.funded?'funding requested':''].join(' '),
  head:['Date','School','Length','Status','Funding','YouTube',''],
  row:i=>`<td>${fmt(i.at)}</td><td><b>${esc(i.principal.school.name)}</b><br><small>${esc(i.principal.name)}</small></td><td>${dur(i.duration)||'—'}</td><td>${badge(i.status,i.status)}</td><td>${fundBadge(i)}</td><td>${ytCell(i)}</td>
   <td style="white-space:nowrap">${bt(`data-review="${i.id}"`,IC.update)} ${hist('insight',i.id)} ${isSuper()?bt(`data-del="${i.id}"`,IC.del,'danger'):''}</td>`},
 funds:{label:'Funds',icon:ICON.coin,filters:[['all','All'],['active','Active'],['inactive','Inactive']],
  top:()=>`<p style="margin:0 0 10px"><button data-fundnew>${ICON.coin}Add fund</button> <small>Rewards are paid from the active fund whose period includes today. Changes need your OTP.</small></p>`,
  rows:()=>S.filter==='all'?data.funds:data.funds.filter(f=>f.status===S.filter),text:f=>[f.name,f.reason,f.status].join(' '),
  head:['Fund','Period','Funds used','Amount each','Total','Status',''],
  row:f=>`<td><b>${esc(f.name)}</b>${f.current?' '+badge('Paid','Current'):''}<br><small>${esc(f.reason)}</small></td><td>${fd(f.periodStart)} →<br>${fd(f.periodEnd)}<br><small>${statusTxt[f.state]||f.state}</small></td><td>${f.used} / ${f.perPeriod}</td><td>NRS ${fmtN(f.amount)}</td><td>NRS ${fmtN(f.amount*f.perPeriod)}</td><td>${badge(f.status==='active'?'Published':'OnReview',f.status)}</td><td style="white-space:nowrap">${bt(`data-fundedit="${f.id}"`,IC.update)} ${hist('fund',f.id)}</td>`},
 release:{label:'Release funding',icon:ICON.coin,filters:[['all','All'],['Pending','Pending release'],['Released','Released']],
  top:()=>{const pend=data.rewards.filter(r=>r.status==='Pending');return `<p style="margin:0 0 10px"><b>${pend.length}</b> award(s) waiting to be released · NRS <b>${fmtN(pend.reduce((s,r)=>s+r.amount,0))}</b>. <small>After a work is published, "Request funding" sends it here. Release it manually once the payment is made.</small></p>`},
  rows:()=>S.filter==='all'?data.rewards:data.rewards.filter(r=>r.status===S.filter),text:r=>[r.principal,r.school,r.reference,r.status].join(' '),
  head:['Awarded','Name','School','Amount','Reason','Status','Reference',''],
  row:r=>`<td>${fmt(r.at)}</td><td><b>${esc(r.principal)}</b></td><td>${esc(r.school)}</td><td>NRS ${fmtN(r.amount)}</td><td><small>${esc(r.reason||'—')}</small></td><td>${badge(r.status==='Released'?'Published':'OnReview',r.status)}${r.releasedAt?'<br><small>'+fmt(r.releasedAt)+'</small>':''}</td><td>${esc(r.reference||'—')}${r.note?'<br><small>'+esc(r.note)+'</small>':''}</td><td style="white-space:nowrap">${r.status==='Pending'?bt(`data-release="${r.id}"`,ICON.check+'Release'):''} ${hist('reward',r.id)}</td>`},
 principals:{label:'Registrations',icon:ICON.users,top:()=>`<p style="margin:0 0 10px"><button data-pnew>${ICON.users}Register school</button> <small>Register a school on its behalf. It becomes active at once and gets the welcome email.</small></p>`,filters:()=>[['all','All'],...data.plans.map(p=>['plan:'+p.id,p.name]),['active','Active'],['inactive','Inactive']],
  rows:()=>S.filter==='all'?data.principals:S.filter.startsWith('plan:')?data.principals.filter(p=>p.planId===S.filter.slice(5)):data.principals.filter(p=>p.status===S.filter),text:p=>[p.name,p.school,p.email,p.phone,p.plan,p.status].join(' '),
  head:['Name','School','Contact','Plan','Status','Works','Last request email',''],
  row:p=>`<td><b>${esc(p.name)}</b></td><td>${esc(p.school)}</td><td>${esc(p.email)}<br><small>${esc(p.phone)}</small></td><td>${badge(planCls(p),p.plan)}</td><td>${badge(p.status,p.status.replace('_',' '))}</td><td>${p.insights}</td><td>${p.lastInsightEmailAt?fmt(p.lastInsightEmailAt):'—'}</td><td style="white-space:nowrap">${bt(`data-pedit="${p.id}"`,IC.update)} ${hist('school',p.id)} ${isSuper()?bt(`data-pdel="${p.id}"`,IC.del,'danger'):''}</td>`},
 plans:{label:'Plans',icon:ICON.tag,filters:[['all','All'],['active','Active'],['inactive','Inactive']],
  top:()=>`<p style="margin:0 0 10px"><button data-plannew>${ICON.tag}Add plan</button> <small>Active plans are listed on the Register screen; visitors must pick one.</small></p>`,
  rows:()=>S.filter==='all'?data.plans:data.plans.filter(p=>p.status===S.filter),text:p=>[p.name,p.description,p.status].join(' '),
  head:['Plan','Price','Details','Registered','Status',''],
  row:p=>`<td><b>${esc(p.name)}</b></td><td>NRS ${p.price}</td><td><small>${esc(p.description).replace(/\n/g,' · ')}</small></td><td>${p.schools}</td><td>${badge(p.status==='active'?'Published':'OnReview',p.status)}</td><td style="white-space:nowrap">${bt(`data-planedit="${p.id}"`,IC.update)} ${hist('plan',p.id)} ${bt(`data-plandel="${p.id}"`,IC.del,'danger')}</td>`},
 videos:{label:'Program videos',icon:ICON.video,filters:[['all','All'],['Published','Published'],['OnReview','On review']],
  top:()=>`<p style="margin:0 0 10px"><button data-vnew>${ICON.video}Record program video</button> <small>The home page plays the latest published, active video.</small></p>`,
  rows:()=>S.filter==='all'?data.programVideos:data.programVideos.filter(v=>v.status===S.filter),text:v=>[v.title,v.status,v.by].join(' '),
  head:['Added','Title','Status','Active','On home page',''],
  row:v=>`<td>${fmt(v.createdAt)}</td><td><b>${esc(v.title)}</b></td><td>${badge(v.status,v.status)}</td><td>${v.active?'Yes':'No'}</td><td>${liveVideo()&&liveVideo().id===v.id?badge('Paid','Live'):'—'}</td><td style="white-space:nowrap">${bt(`data-vedit="${v.id}"`,IC.update)} ${hist('video',v.id)} ${bt(`data-vdel="${v.id}"`,IC.del,'danger')}</td>`},
 admins:{label:'Admin users',icon:ICON.shield,filters:[['all','All'],['active','Active'],['inactive','Inactive']],
  top:()=>`<p style="margin:0 0 10px"><button data-adnew>${ICON.shield}Add admin</button> <button data-adnew="super">${ICON.shield}Add super admin</button> <small>Super admins have full access. Admins can only register schools and review works. Sign in with phone or email and a one-time code. One active admin per phone number.</small></p>`,
  rows:()=>S.filter==='all'?data.admins:data.admins.filter(a=>a.status===S.filter),text:a=>[a.name,a.phone,a.email,a.status].join(' '),
  head:['Name','Phone','Email','Role','Status',''],row:a=>`<td><b>${esc(a.name)}</b></td><td>${esc(a.phone)}</td><td>${esc(a.email)}</td><td>${badge((a.role||'super')==='super'?'Paid':'OnReview',(a.role||'super')==='super'?'Super admin':'Admin')}</td><td>${badge(a.status,a.status)}</td><td style="white-space:nowrap">${bt(`data-adedit="${a.id}"`,IC.update)} ${hist('admin',a.id)}</td>`},
 templates:{label:'Email templates',icon:ICON.mail,custom:()=>tplHtml(),after:()=>tplPreview()},
 manual:{label:'Manual send',after:()=>manualAfter(),icon:ICON.send,custom:()=>manualHtml()},
 random:{label:'Random send',icon:ICON.shuffle,filters:[['all','All active'],['eligible','Eligible now'],['wait','Recently emailed']],
  top:()=>{const n=data.principals.filter(eligible).length,d=data.summary.repeatDays;return `<p style="margin-top:0">Picks one random active school that has not received a request in the last ${d} days. <b>${n}</b> eligible now.</p><p><button id="randGo" ${n?'':'disabled'}>${ICON.shuffle}Send random topic request</button></p>`},
  rows:()=>{const l=data.principals.filter(p=>p.status==='active');return S.filter==='eligible'?l.filter(eligible):S.filter==='wait'?l.filter(p=>!eligible(p)):l},
  text:p=>[p.name,p.school,p.email].join(' '),head:['Name','School','Email','Last request email','Eligible'],
  row:p=>`<td><b>${esc(p.name)}</b></td><td>${esc(p.school)}</td><td>${esc(p.email)}</td><td>${p.lastInsightEmailAt?fmt(p.lastInsightEmailAt):'—'}</td><td>${eligible(p)?badge('Published','Eligible'):badge('OnReview','Wait until '+new Date(p.lastInsightEmailAt+data.summary.repeatDays*864e5).toLocaleDateString())}</td>`},
 emails:{label:'Outbox',icon:ICON.inbox,filters:[],rows:()=>data.emails,text:e=>[e.to,e.subject,e.kind].join(' '),head:['When','To','Subject','Type','Status'],
  row:e=>`<td>${fmt(e.sentAt)}</td><td>${esc(e.to)}</td><td><a href="/outbox/${e.id}.html" target="_blank">${esc(e.subject)}</a></td><td>${esc(e.kind)}</td><td>${esc(e.status||'saved')}${e.error?`<br><small>${esc(e.error)}</small>`:''}</td>`},
 configs:{label:'Configs',icon:ICON.cfg,custom:()=>cfgHtml()},
 health:{label:'Health monitor',icon:ICON.pulse,custom:()=>healthHtml()}
};
if(TABS[location.hash.slice(1)])S.tab=location.hash.slice(1);
const ytCell=i=>{const y=i.youtube;if(!y)return'—';if(y.status==='published')return`<a href="${esc(y.url)}" target="_blank" rel="noopener">▶ Watch</a>`;if(y.status==='uploading')return'Uploading…';return`<span title="${esc(y.error||'')}">${badge('OnReview','Failed')}</span>`};
const planCls=p=>{const pl=data.plans.find(x=>x.id===p.planId);return pl&&pl.price>0?'Paid':'Free'};
const liveVideo=()=>data.programVideos.filter(v=>v.status==='Published'&&v.active).sort((a,b)=>(b.publishedAt||b.createdAt)-(a.publishedAt||a.createdAt))[0];
const TAB_ORDER=['dashboard','plans','principals','manual','random','insights','funds','release','videos','emails','configs','health','admins','templates'];
function render(){
 if(!tabVisible(S.tab))S.tab='dashboard';
 const T=TABS[S.tab];
 tabs.innerHTML=Object.entries(TABS).filter(([k])=>tabVisible(k)).sort((x,y)=>TAB_ORDER.indexOf(x[0])-TAB_ORDER.indexOf(y[0])).map(([k,t])=>`<button data-tab="${k}" class="${k===S.tab?'on':''}">${t.icon||''}${t.label}${countOf(k)!==undefined?' ('+countOf(k)+')':''}</button>`).join('');
 if(T.custom){if(!custom.dataset.tab||custom.dataset.tab!==S.tab||!custom.contains(document.activeElement)){custom.innerHTML=T.custom();custom.dataset.tab=S.tab;T.after&&T.after()}tools.innerHTML='';tbl.innerHTML='';pager.innerHTML='';return}
 custom.innerHTML=T.top?T.top():'';custom.dataset.tab='';
 const keep=document.activeElement&&document.activeElement.id==='sq';
 const fl=typeof T.filters==='function'?T.filters():T.filters;
 tools.innerHTML=`<input id="sq" placeholder="Search ${T.label.toLowerCase()}…" value="${esc(S.q)}">${fl.length?`<select id="sf" style="max-width:200px">${fl.map(([v,l])=>`<option value="${esc(v)}" ${S.filter===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`:''}`;
 if(keep){const el=$('#sq');el.focus();el.setSelectionRange(S.q.length,S.q.length)}
 const q=S.q.trim().toLowerCase();let rows=T.rows();if(q)rows=rows.filter(r=>T.text(r).toLowerCase().includes(q));
 const pages=Math.max(1,Math.ceil(rows.length/PAGE));if(S.page>pages)S.page=pages;
 const slice=rows.slice((S.page-1)*PAGE,S.page*PAGE);
 tbl.innerHTML=slice.length?`<table><thead><tr>${T.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${slice.map(r=>`<tr>${T.row(r)}</tr>`).join('')}</tbody></table>`:'<p class="small">Nothing found.</p>';
 const from=rows.length?(S.page-1)*PAGE+1:0;
 pager.innerHTML=`<small>${from}–${Math.min(S.page*PAGE,rows.length)} of ${rows.length}</small><div class="pg"><button class="alt" data-pg="${S.page-1}" ${S.page<=1?'disabled':''}>‹ Prev</button>${Array.from({length:pages},(_,i)=>i+1).filter(n=>n===1||n===pages||Math.abs(n-S.page)<=1).map((n,i,a)=>(i&&n-a[i-1]>1?'<span>…</span>':'')+`<button class="${n===S.page?'':'alt'}" data-pg="${n}">${n}</button>`).join('')}<button class="alt" data-pg="${S.page+1}" ${S.page>=pages?'disabled':''}>Next ›</button></div>`;
}
const DAY=864e5,eligible=p=>p.status==='active'&&(!p.lastInsightEmailAt||Date.now()-p.lastInsightEmailAt>=data.summary.repeatDays*DAY);
const countOf=k=>({insights:data.insights.length,funds:data.funds.length,release:data.rewards.filter(r=>r.status==='Pending').length,principals:data.principals.length,plans:data.plans.length,videos:data.programVideos.length,admins:data.admins.length,emails:data.emails.length}[k]);
const fmtN=n=>(Math.round(n*100)/100).toLocaleString();
const fd=t=>new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
const statusTxt={active:'Active',upcoming:'Not started',ended:'Ended'};
function dashHtml(){const f=data.fund,s=data.summary;if(!s||(isSuper()&&!f))return'<p class="small">Loading…</p>';
 if(!isSuper())return `<h2>${ICON.users}Registrations</h2><div class="fund"><div><b>${s.registrations}</b><span>Total registrations</span></div>${s.byPlan.map(p=>`<div><b>${p.count}</b><span>${esc(p.name)} plan</span></div>`).join('')}</div><h2>${ICON.video}Works</h2><div class="fund"><div><b>${data.insights.length}</b><span>Total works</span></div><div><b>${data.insights.filter(i=>i.status==='OnReview').length}</b><span>Waiting for review</span></div><div><b>${data.insights.filter(i=>i.status==='Published').length}</b><span>Published</span></div></div>`;
 return `<h2 style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">${ICON.coin}Funds</h2>
 <div class="fund"><div><b>${f.remaining} / ${f.perPeriod}</b><span>Funds remaining${f.name?" · "+esc(f.name):""}</span></div><div><b>NRS ${fmtN(f.amount)}</b><span>Per fund</span></div><div><b>NRS ${fmtN(f.remaining*f.amount)}</b><span>Budget left</span></div><div class="sm"><b>${fd(f.periodStart)} →<br>${fd(f.periodEnd)}</b><span>Funding period · ${statusTxt[f.state]}</span></div></div>

 <h2>${ICON.users}Registrations</h2><div class="fund"><div><b>${s.registrations}</b><span>Total registrations</span></div>${s.byPlan.map(p=>`<div><b>${p.count}</b><span>${esc(p.name)} plan</span></div>`).join('')}</div>`}
function fundForm(f,id){return `<form id="fdf"><input type="hidden" name="version" value="${f.version}"><label>Fund name</label><input name="name" value="${esc(f.name)}" maxlength="60" required>
<div class="row"><div><label>Start date</label><input name="startDate" type="date" value="${f.startDate}" required></div><div><label>End date</label><input name="endDate" type="date" value="${f.endDate}" required></div></div>
<div class="row"><div><label>Number of funds</label><input name="perPeriod" type="number" min="1" max="1000" value="${f.perPeriod}" required></div><div><label>Amount per fund (NRS)</label><input name="amount" type="number" min="1" step="any" value="${f.amount}" required></div></div>
<div class="fundbox" style="justify-content:space-between"><span><b>Total amount</b></span><b id="ftotal" style="font-size:20px">NRS ${fmtN(f.perPeriod*f.amount)}</b></div>
<label>Reason for the fund</label><textarea name="reason" rows="3" maxlength="500" required placeholder="Say what the money is for and who benefits.">${esc(f.reason)}</textarea>
<label>Status</label><select name="status"><option value="active" ${f.status==='active'?'selected':''}>active</option><option value="inactive" ${f.status==='inactive'?'selected':''}>inactive</option></select>
<label>OTP to confirm</label><input name="otp" class="otp" maxlength="4" inputmode="numeric" pattern="[0-9]{4}" autocomplete="one-time-code" required style="max-width:180px;font-size:20px"> <button type="button" class="alt btn-sm" data-fundotp>Send code</button><br><br><button type="submit">${IC.save}</button> <button type="button" class="alt" id="cl">${IC.cancel}</button></form>`}
function editFund(id){const t=Date.now(),f=id?data.funds.find(x=>x.id===id):{name:'',startDate:isoD(t),endDate:isoD(t+30*864e5),perPeriod:5,amount:500,reason:'',status:'active',version:0};
 rvBody.innerHTML=`<h2>${id?'Update':'Add'} fund</h2>${id?`<p class="small">${f.used} of ${f.perPeriod} funds already awarded.</p>`:''}<div id="rvMsg"></div>${fundForm(f,id)}`;
 rv.showModal();$('#cl').onclick=closeRv;if(id&&locked(f))lockField('#fdf [name=status]');
 $('#fdf').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));try{id?await put('/api/admin/funds/'+id,o):await post('/api/admin/funds',o);toast('Fund saved');closeRv();await load()}catch(err){show($('#rvMsg'),err.message);await fail(err)}}}
const isoD=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const MPAGE=12;
function manualRows(){const act=data.principals.filter(p=>p.status==='active'),q=S.msearch.trim().toLowerCase();return q?act.filter(p=>[p.name,p.school,p.email,p.phone].join(' ').toLowerCase().includes(q)):act}
function manualHtml(){const all=data.principals.filter(p=>p.status==='active'),rows=manualRows(),pages=Math.max(1,Math.ceil(rows.length/MPAGE));if(S.mpage>pages)S.mpage=pages;const slice=rows.slice((S.mpage-1)*MPAGE,S.mpage*MPAGE);
 return `<form id="mf"><label>Send to</label><div class="hb" style="margin-bottom:8px"><input id="msq" placeholder="Search schools…" value="${esc(S.msearch)}" style="max-width:280px"><button type="button" class="alt btn-sm" data-mselall>Select all ${rows.length}</button><button type="button" class="alt btn-sm" data-mselnone>Clear</button><b>${S.msel.size}</b> selected of ${all.length}</div>
 <div class="sgrid">${slice.map(p=>`<label class="scard ${S.msel.has(p.id)?'on':''}"><input type="checkbox" data-msel="${p.id}" ${S.msel.has(p.id)?'checked':''}><span><b>${esc(p.school)}</b><br>${esc(p.name)}<br><small>${esc(p.email)}</small></span></label>`).join('')||'<small>No active schools found.</small>'}</div>
 <div class="pager"><small>${rows.length?(S.mpage-1)*MPAGE+1:0}–${Math.min(S.mpage*MPAGE,rows.length)} of ${rows.length}</small><div class="pg"><button type="button" class="alt" data-mpg="${S.mpage-1}" ${S.mpage<=1?'disabled':''}>‹ Prev</button><span class="small">Page ${S.mpage} / ${pages}</span><button type="button" class="alt" data-mpg="${S.mpage+1}" ${S.mpage>=pages?'disabled':''}>Next ›</button></div></div>
 <p class="small">Each school gets a topic from the topic pool (Configs → insight.questions) in the "Talk / debate request" email. A school can submit its video only after this email is sent. Manual sends do not affect the repeat rule of random sends.</p><button type="submit" ${S.msel.size?'':'disabled'}>${ICON.send}Send request to ${S.msel.size} school(s)</button></form>`}
function manualAfter(){if(S.mfocus){const el=$('#'+S.mfocus);if(el){el.focus();el.setSelectionRange&&el.setSelectionRange(el.value.length,el.value.length)}S.mfocus=null}}
const mrender=(focus)=>{S.mfocus=focus||null;custom.dataset.tab='';render()};
// ----- email templates -----

function editVideo(id){const v=id?data.programVideos.find(x=>x.id===id):null;

 rvBody.innerHTML=`<h2>${v?'Review & publish':'Record'} program video</h2><div id="rvMsg"></div><form id="vf"><input type="hidden" name="version" value="${v?v.version:0}">
 <label>Title</label><input name="title" value="${esc(v?v.title:'')}" maxlength="120" required>

 :`<div class="vbox" style="height:300px;flex:none;margin-top:10px"><video id="rv_v" playsinline></video><div class="vph" id="rv_ph">Press Record to start</div></div>
 <div class="rmeta"><span id="rv_t"></span><span id="rv_s">Max size ${maxMB} MB</span></div>
 <div class="rbar" style="margin-top:8px"><button type="button" id="rv_rec" class="recbtn">${ICON.rec}Record</button><button type="button" id="rv_play" class="alt" disabled>${ICON.play}Play</button><button type="submit" id="rv_save" disabled>${ICON.check}Save &amp; Submit</button><button type="button" class="alt" id="cl">${IC.cancel}</button></div><p class="small">New videos start as OnReview. Publish them after review.</p>`}</form>`;

 if(!v)setupRecorder(maxMB);
 $('#vf').onsubmit=async e=>{e.preventDefault();const f=e.target,btn=f.querySelector('[type=submit]');btn.disabled=true;
  try{if(v)await put('/api/admin/program-videos/'+id,{version:v.version,title:f.title.value,status:f.status.value,active:f.active.checked});
   else{const fd=new FormData();fd.append('title',f.title.value);fd.append('video',VR.blob,'program.webm');await api('/api/admin/program-videos',{method:'POST',body:fd})}
   stopRec(true);toast('Video saved');closeRv();await load()}catch(err){show($('#rvMsg'),err.message);btn.disabled=false;await fail(err)}}}
function stopRec(discard){if(VR.rec&&VR.rec.state==='recording'){VR.discard=discard;VR.rec.stop()}VR.stream&&VR.stream.getTracks().forEach(t=>t.stop())}
function setupRecorder(maxMB){VR={blob:null};const v=$('#rv_v'),rec=$('#rv_rec'),play=$('#rv_play'),save=$('#rv_save');let tick,t0,size=0,chunks=[],recording=false;
 const mm=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0'),mb=b=>(b/1048576).toFixed(1);
 const bps=Math.round(Math.min(2.5e6,Math.max(500e3,maxMB*1048576*8*0.9/300)));
 async function start(){if(VR.blob)URL.revokeObjectURL(v.src);VR.blob=null;play.disabled=save.disabled=true;v.removeAttribute('src');v.controls=false;chunks=[];size=0;$('#rvMsg').innerHTML='';
  try{const m=await getMediaStream();VR.stream=m.stream;watchStream(VR.stream,msg=>{if(recording){VR.rec.stop();show($('#rvMsg'),msg)}});if(m.note)show($('#rvMsg'),m.note,true)}catch(e){return show($('#rvMsg'),e.message)}
  v.srcObject=VR.stream;v.muted=true;v.play().catch(()=>{});$('#rv_ph').hidden=true;
  try{VR.rec=new MediaRecorder(VR.stream,{videoBitsPerSecond:bps-48000,audioBitsPerSecond:48000})}catch(e){VR.rec=new MediaRecorder(VR.stream)}
  const r=VR.rec;VR.discard=false;
  r.ondataavailable=e=>{if(!e.data.size)return;chunks.push(e.data);size+=e.data.size;$('#rv_s').textContent=mb(size)+' / '+maxMB+' MB';if(size>=maxMB*1048576*0.96&&r.state==='recording'){toast('Size limit reached — recording stopped');r.stop()}};
  r.onstop=()=>{clearInterval(tick);VR.stream.getTracks().forEach(t=>t.stop());v.srcObject=null;v.muted=false;recording=false;rec.innerHTML=ICON.rec+'Record';if(VR.discard)return;
   const b=new Blob(chunks,{type:r.mimeType||'video/webm'});if(b.size>maxMB*1048576)return show($('#rvMsg'),'Video is larger than '+maxMB+' MB. Record a shorter video.');
   VR.blob=b;v.src=URL.createObjectURL(b);v.controls=true;play.disabled=save.disabled=false;$('#rv_s').textContent=mb(b.size)+' / '+maxMB+' MB'};
  r.start(1000);t0=Date.now();recording=true;rec.innerHTML=ICON.rec+'Stop';tick=setInterval(()=>{$('#rv_t').textContent=mm((Date.now()-t0)/1000)},250)}
 rec.onclick=()=>recording?VR.rec.stop():start();
 play.onclick=()=>{v.currentTime=0;v.play().catch(()=>{})}}
