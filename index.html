</div>

<section class="face fr" id="f-register" hidden><div class="fbarx"><button class="alt fclose" data-p="home" aria-label="Close" title="Close">✕</button></div><div class="loader"><div class="spin"></div></div><iframe id="regFrame" title="Register"></iframe></section></div>
</main>
<dialog id="ov" class="ovl login"><button class="alt ovx" id="ovX" aria-label="Close">✕</button><iframe id="ovf" title="Login" allow="camera; microphone; autoplay; fullscreen"></iframe></dialog>
<script src="common.js"></script><script>
const T='perspective(1400px) rotateY(';
const reduce=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
// ---------- home: the program's own latest approved, active video ----------
async function loadProgram(){const v=await api('/api/program-video').catch(()=>null);
 if(v){pnone.hidden=true;pv.style.visibility='visible';if(!pv.src.endsWith(v.video))pv.src=v.video;pv.muted=true;pv.play().then(()=>{snd.hidden=false}).catch(()=>{})}else{pv.removeAttribute('src');pv.load();pv.style.visibility='hidden';pnone.hidden=false}}
function fillSite(s){if(!s)return;hT.textContent=s.heroTitle;hP.textContent=s.heroText;document.title=s.program+' · '+s.tagline}
snd.onclick=()=>{pv.muted=!pv.muted;snd.textContent=pv.muted?'🔇':'🔊';snd.title=pv.muted?'Sound on':'Sound off'};
document.querySelectorAll('.flipbtn').forEach(b=>b.innerHTML=ICON.space);
document.addEventListener('click',e=>{if(e.target.closest('[data-flip]')){flip.classList.toggle('flipped');refreshStats()}});
// ---------- watch: the 5 most recently funded videos (no details shown) ----------
let LIST=[],cur=0,playingAll=false,curId=null;
const dur=s=>s?' · '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):'';
function fillIns(){inone.hidden=!!LIST.length;iv.style.visibility=LIST.length?'visible':'hidden';btnAll.disabled=iNext.disabled=!LIST.length}
function setIns(k,autoplay){if(!LIST.length)return;cur=(k+LIST.length)%LIST.length;curId=LIST[cur].id;iv.src=LIST[cur].video;fillIns();if(autoplay)iv.play().catch(()=>{})}
btnAll.onclick=()=>{playingAll=true;setIns(0,true)};
iNext.onclick=()=>setIns(cur+1,playingAll||!iv.paused);
iv.addEventListener('ended',()=>{if(playingAll&&cur<LIST.length-1)setIns(cur+1,true);else playingAll=false});
async function loadInsights(){iload.hidden=false;try{LIST=await api('/api/insights/recent-funded')}catch(e){LIST=[]}
 const k=LIST.findIndex(i=>i.id===curId);cur=k<0?0:k;if(LIST.length&&(k<0||!iv.src))setIns(cur,false);else fillIns();iload.hidden=true}
// play a given insight (called by the Directory frame)
window.playInsight=async id=>{await openPanel('insights');await loadInsights();const k=LIST.findIndex(i=>i.id===id);if(k<0)return toast('That insight is not available',false);playingAll=false;setIns(k,true)};
// ---------- overlays (login dialogs; the page behind is blurred) ----------
const OVERLAYS={give:'/login.html?next=/interview.html',admin:'/admin-login.html'};
window.ovSize=s=>{ov.classList.toggle('tall',s==='tall');ov.classList.toggle('login',s!=='tall')};
function openOverlay(k){ov.classList.add('login');ov.classList.remove('tall');ovf.src=OVERLAYS[k];ov.showModal()}
window.closeOverlay=()=>{if(ov.open)ov.close()};
ov.addEventListener('close',()=>{ovf.src='about:blank';post('/api/auth/logout').catch(()=>{})}); // a school session never outlives the dialog
ovX.onclick=closeOverlay;
ov.addEventListener('click',e=>{if(e.target===ov)closeOverlay()});
// ---------- panels: Home / Insights / Directory / Register ----------
const ORDER=['home','insights','directory','register'];let curP='home',busy=false,loaded={};
const FRAMES={directory:['dirFrame','/principals.html'],register:['regFrame','/register.html']};
window.resetFace=p=>{loaded[p]=0};
const face=p=>document.getElementById('f-'+p);
// every time a tab is opened (or its button clicked again) it is reloaded asynchronously, so the latest data shows
function prep(p){
 if(p==='home')refreshStats(),loadProgram(),pv.play&&pv.play().catch(()=>{});
 if(p==='insights')refreshStats(),loadInsights();
 if(FRAMES[p]){const f=document.getElementById(FRAMES[p][0]);face(p).querySelector('.loader').hidden=false;if(!loaded[p]){loaded[p]=1;f.src=FRAMES[p][1]}else f.contentWindow.location.replace(FRAMES[p][1])}}
for(const k in FRAMES){const f=document.getElementById(FRAMES[k][0]);f.addEventListener('load',()=>{if(f.getAttribute('src'))face(k).querySelector('.loader').hidden=true})}
async function openPanel(p,animate=true){
 if(OVERLAYS[p]){if(p==='admin'&&window.IS_ADMIN){location.href='/admin.html';return}openOverlay(p);return}
 if(busy)return;if(p===curP){prep(p);return}busy=true;if(curP==='insights')iv.pause();prep(p);
  history.replaceState(null,'',p==='home'?location.pathname:'#'+p);
 const from=face(curP),to=face(p),dir=ORDER.indexOf(p)>ORDER.indexOf(curP)?1:-1;
 if(animate&&from.animate&&!reduce()){
  await from.animate([{transform:T+'0deg)',opacity:1},{transform:T+(-90*dir)+'deg)',opacity:.2}],{duration:230,easing:'ease-in'}).finished;
  from.hidden=true;to.hidden=false;to.scrollTop=0;
  await to.animate([{transform:T+(90*dir)+'deg)',opacity:.2},{transform:T+'0deg)',opacity:1}],{duration:230,easing:'ease-out'}).finished;
 }else{from.hidden=true;to.hidden=false}
 curP=p;busy=false}
window.openPanel=openPanel;
document.addEventListener('click',e=>{const a=e.target.closest('[data-p]');if(!a)return;e.preventDefault();openPanel(a.dataset.p)});
addEventListener('hashchange',()=>{const x=location.hash.slice(1);if(OVERLAYS[x])return;openPanel(ORDER.includes(x)?x:'home')});
window.registeredOK=()=>{toast('Registration successful! A welcome email was sent.');refreshStats();openPanel('home')};
{const x=location.hash.slice(1);if(ORDER.slice(1).includes(x)){face('home').hidden=true;face(x).hidden=false;curP=x;prep(x);0}}
// ---------- first load: show a loading icon, then the full page ----------
const done=()=>boot.classList.add('gone');setTimeout(done,5000);
Promise.all([refreshSite().then(fillSite),refreshStats(),loadProgram(),loadInsights(),refreshAdmin()]).finally(()=>{done();setTimeout(()=>boot.remove(),400)});
</script></body></html>
